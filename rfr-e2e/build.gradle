plugins {
    id 'io.qameta.allure' version '4.3.0'
}

group = 'io.student'
version = '1.0.0'

def allureJavaVersion = '3.0.0'
def allureReportVersion = '3.17.0'
def aspectJVersion = '1.9.25.1'
def junitVersion = '6.1.3'
def playwrightVersion = '1.63.0'

configurations {
    agent {
        canBeResolved = true
        canBeConsumed = false
    }
}

dependencies {
    agent "org.aspectj:aspectjweaver:$aspectJVersion"

    testImplementation platform("org.junit:junit-bom:$junitVersion")
    testImplementation platform("io.qameta.allure:allure-bom:$allureJavaVersion")

    testImplementation "io.qameta.allure:allure-jupiter"
    testImplementation "io.qameta.allure:allure-playwright"
    testImplementation "com.microsoft.playwright:playwright:$playwrightVersion"

    testImplementation "org.junit.jupiter:junit-jupiter"
    testImplementation "org.junit.platform:junit-platform-suite"
    testImplementation "org.junit.platform:junit-platform-testkit"
    testImplementation platform("org.springframework.boot:spring-boot-dependencies:4.1.1")
    testImplementation "org.springframework:spring-jdbc"
    testImplementation "org.springframework.security:spring-security-crypto"
    testImplementation "mysql:mysql-connector-java:8.0.33"
    testRuntimeOnly "org.junit.platform:junit-platform-launcher"
    testRuntimeOnly "org.aspectj:aspectjrt:$aspectJVersion"
}


allure {
    version = allureReportVersion
    adapter {
        autoconfigure.set(false)
    }
}

processTestResources {
    from("${rootProject.projectDir}/rfr-auth/src/main/resources/db/migration/rangiffler-auth") {
        into 'db/migration/rangiffler-auth'
    }
    from("${rootProject.projectDir}/rfr-api/src/main/resources/db/migration/rangiffler-api") {
        into 'db/migration/rangiffler-api'
    }
}

tasks.withType(Test).configureEach {
    outputs.upToDateWhen { false }
    System.properties.each { key, value ->
        if (key.toString().startsWith('rfr.')) {
            systemProperty key.toString(), value
        }
    }
    jvmArgumentProviders.add({ ["-javaagent:${configurations.agent.singleFile}"] } as CommandLineArgumentProvider)
}

test {
    useJUnitPlatform {
        excludeEngines 'junit-platform-suite'
    }
}

tasks.register('e2e', Test) {
    group = 'verification'
    description = 'Runs tests through E2eSuite'
    testClassesDirs = sourceSets.test.output.classesDirs
    classpath = sourceSets.test.runtimeClasspath
    useJUnitPlatform()
}

tasks.register('installPlaywright', JavaExec) {
    group = 'verification'
    description = 'Downloads Playwright Chromium once'
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'com.microsoft.playwright.CLI'
    args 'install', 'chromium'
}

tasks.register('installPlaywrightWithDeps', JavaExec) {
    group = 'verification'
    description = 'Downloads Playwright Chromium and OS libraries'
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'com.microsoft.playwright.CLI'
    args 'install', '--with-deps', 'chromium'
}
